name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile:
    name: Flutter analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true
      - name: Install Flutter dependencies
        run: flutter pub get --enforce-lockfile
      - name: Analyze Flutter code
        run: flutter analyze --no-pub
      - name: Test Flutter code
        run: flutter test --no-pub

  api:
    name: NestJS build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: synthetic-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:synthetic-test@127.0.0.1:5432/postgres
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - name: Install API dependencies
        run: npm ci
      - name: Prepare production schema for OCR integration tests
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: |
          node <<'JS'
          const { Client } = require('pg');
          const client = new Client({ connectionString: process.env.TEST_DATABASE_URL });
          async function prepare() {
            await client.connect();
            try {
              await client.query(`CREATE ROLE anon NOLOGIN;
                CREATE ROLE authenticated NOLOGIN;
                CREATE SCHEMA auth;
                CREATE TABLE auth.users (id uuid PRIMARY KEY, aud text, role text, email text)`);
            } finally { await client.end(); }
          }
          prepare().catch((error) => { console.error(error.message); process.exitCode = 1; });
          JS
          npm run db:migrate
      - name: Build and test API
        run: npm test

  ai:
    name: FastAPI unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/ai
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: apps/ai/uv.lock
      - name: Install AI dependencies
        run: uv sync --locked --python 3.13
      - name: Test AI service
        run: uv run --locked python -m unittest
