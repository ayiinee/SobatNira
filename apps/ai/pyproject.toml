[project]
name = "sobatnira-ai"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "jsonschema[format]>=4.23,<5",
    "pillow>=12,<13",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
paddle = [
    "paddleocr==3.7.0 ; platform_machine == 'AMD64' or platform_machine == 'x86_64'",
    "paddlepaddle==3.3.1 ; (platform_machine == 'x86_64' and sys_platform == 'linux') or (platform_machine == 'AMD64' and sys_platform == 'win32')",
]
