name: sobatnira
description: Aplikasi operasional SobatNira.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  http: ^1.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sobatnira/art/
    - assets/sobatnira/icons/
    - assets/sobatnira/fonts/OFL.txt
  fonts:
    - family: Inter
      fonts:
        - asset: assets/sobatnira/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/sobatnira/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/sobatnira/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/sobatnira/fonts/Inter-Bold.ttf
          weight: 700
